<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Night Projector</title>
    <style>
        /* ========================================================
           1. CSS RESET & GLOBAL STYLES
           ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            touch-action: none; 
        }

        /* ========================================================
           2. DISPLAY LAYER (PROJECTOR VIEW)
           ======================================================== */
        #display-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; transition: filter 0.5s ease;
        }

        #theme-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; overflow: hidden;
            transition: background 1s ease;
        }

        /* Layer Custom Overlay (Teks & Media) */
        #custom-overlay-layer {
            position: absolute;
            top: 5%; right: 5%;
            z-index: 3;
            max-width: 30%;
            text-align: right;
            pointer-events: none;
            opacity: 0.8;
        }
        #custom-overlay-layer img {
            max-width: 150px; border-radius: 10px; margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #custom-overlay-layer .overlay-text {
            font-size: 1.5rem; font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Layer Nama Bayi */
        #baby-name-layer {
            position: absolute;
            top: 12%; width: 100%; text-align: center;
            z-index: 3; font-size: 2.5rem; font-weight: 300; letter-spacing: 5px;
            opacity: 0.6; animation: floatName 10s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(0,0,0,0.5); pointer-events: none;
        }

        @keyframes floatName {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.05); opacity: 0.9; }
        }

        /* Layer Al-Quran Per Ayat */
        #quran-layer {
            position: absolute;
            top: 25%; left: 10%; width: 80%; height: 20%;
            text-align: center; z-index: 3;
            opacity: 0; /* Animasi fade masuk/keluar diatur oleh JS */
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
            pointer-events: none; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #ffd700;
            transition: opacity 1s ease;
        }
        .quran-ayah-text { margin-bottom: 10px; line-height: 1.6; }
        .quran-translation { font-size: 1rem; color: #fff; opacity: 0.8; font-family: 'Segoe UI', sans-serif; }

        /* Layer Jam */
        #clock-layer {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3; text-align: center; text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            pointer-events: none;
            /* Container lebar tetap agar tidak goyang (stabil) */
            width: 80vw; display: flex; flex-direction: column; align-items: center;
        }

        #prayer-layer {
            position: absolute;
            bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 3; display: flex; gap: 20px;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
            padding: 15px 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none; transition: opacity 1s ease;
        }

        .prayer-item { text-align: center; }
        .prayer-name { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }
        .prayer-time { font-size: 1.2rem; font-weight: bold; }

        #sleep-timer-display {
            position: absolute; top: 20px; right: 20px; z-index: 3;
            font-size: 1.2rem; background: rgba(0,0,0,0.5);
            padding: 5px 15px; border-radius: 20px; display: none;
        }

        /* Overlay Gelap */
        #brightness-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0); z-index: 10; pointer-events: none;
            transition: background-color 0.5s ease;
        }

        /* Tombol Matikan Alarm di Layar Utama */
        #display-stop-alarm {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 200; padding: 20px 40px; font-size: 2rem; font-weight: bold;
            background: #ff4757; color: white; border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,0,0,0.5);
            display: none; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .alarm-flash { animation: flashRed 1s infinite alternate; }
        @keyframes flashRed { 0% { background-color: rgba(255, 0, 0, 0); } 100% { background-color: rgba(255, 0, 0, 0.5); } }

        /* ========================================================
           3. THEMES CSS LENGKAP (> 10 TEMA)
           ======================================================== */
        .theme-night-sky { background: linear-gradient(to bottom, #020111 0%, #20124d 100%); }
        .theme-ocean { background: linear-gradient(to bottom, #001f3f 0%, #001122 100%); }
        .theme-forest { background: linear-gradient(to bottom, #001a00 0%, #000d00 100%); }
        .theme-sunset { background: linear-gradient(to bottom, #ff512f 0%, #dd2476 100%); }
        .theme-aurora { background: linear-gradient(135deg, #000428, #004e92, #000428); background-size: 200% 200%; animation: bgShift 15s ease infinite; }
        .theme-galaxy { background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); }
        .theme-rain { background: linear-gradient(to bottom, #2b4162 0%, #fa9c7a 100%); }
        .theme-snow { background: linear-gradient(to bottom, #8e9eab 0%, #eef2f3 100%); }
        .theme-fire { background: linear-gradient(to top, #870000 0%, #190a05 100%); }
        .theme-underwater { background: linear-gradient(to bottom, #00416a 0%, #000000 100%); }
        .theme-clouds { background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 100%); }
        .theme-matrix { background: #000; }

        @keyframes bgShift { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        /* Partikel Tema CSS */
        .particle { position: absolute; border-radius: 50%; }
        .p-star { background: #fff; animation: twinkle infinite ease-in-out; }
        .p-firefly { background: #ccff00; box-shadow: 0 0 10px 2px #ccff00; animation: float infinite ease-in-out; }
        .p-rain { background: rgba(255,255,255,0.5); width: 2px; height: 30px; border-radius: 0; animation: fall linear infinite; }
        .p-snow { background: #fff; animation: fallSlow linear infinite; }
        .p-bubble { border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); animation: rise linear infinite; }
        .p-fire { background: rgba(255, 100, 0, 0.6); filter: blur(5px); animation: rise linear infinite; }
        .p-cloud { background: rgba(255,255,255,0.1); filter: blur(20px); border-radius: 50%; animation: drift linear infinite; }
        .p-matrix { color: #0f0; font-family: monospace; font-size: 1.2rem; font-weight: bold; border-radius: 0; animation: fall linear infinite; text-shadow: 0 0 5px #0f0; }

        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; } }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(50px, -50px) scale(1.5); } 75% { opacity: 1; } }
        @keyframes fall { 0% { transform: translateY(-10vh); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
        @keyframes fallSlow { 0% { transform: translateY(-10vh) translateX(0); opacity: 1; } 100% { transform: translateY(110vh) translateX(20px); opacity: 0; } }
        @keyframes rise { 0% { transform: translateY(110vh) scale(1); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        @keyframes drift { 0% { transform: translateX(-20vw); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(120vw); opacity: 0; } }

        .wave {
            position: absolute; bottom: 0; width: 200%; height: 300px;
            background: rgba(0, 119, 255, 0.1); border-radius: 40%;
            animation: wave-move 10s infinite linear; filter: blur(10px);
        }
        .wave:nth-child(2) { bottom: -50px; background: rgba(0, 119, 255, 0.15); animation-duration: 15s; animation-direction: reverse; }
        @keyframes wave-move { 0% { transform: translateX(0) rotate(0deg); } 100% { transform: translateX(-50%) rotate(360deg); } }
        .performance-mode .wave { filter: none; }
        .performance-mode .particle { filter: none; box-shadow: none; }

        /* ========================================================
           4. CLOCK STYLES (STABILISASI & FONT)
           ======================================================== */
        .clock-digital {
            font-size: 8rem; font-weight: bold; letter-spacing: 2px;
            margin-bottom: 10px; transition: color 0.3s ease, font-family 0.3s ease;
            /* PENTING: Memaksa angka memiliki lebar yang sama agar jam stabil tidak bergoyang */
            font-variant-numeric: tabular-nums; 
            text-align: center; width: 100%;
        }
        .clock-date { font-size: 1.5rem; opacity: 0.8; letter-spacing: 2px; width: 100%; text-align: center; }
        .clock-analog {
            width: 300px; height: 300px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%;
            position: relative; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); margin: 0 auto 20px auto;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 10px; transform: translateX(-50%); }
        .hand-hour { width: 6px; height: 80px; background: rgba(255,255,255,0.8); }
        .hand-minute { width: 4px; height: 120px; background: #fff; }
        .hand-second { width: 2px; height: 140px; background: #ff4757; }
        .analog-center { position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; background: #ff4757; border-radius: 50%; transform: translate(-50%, -50%); }

        /* ========================================================
           5. ELEGAN ADMIN LAYER UI & TABS
           ======================================================== */
        #secret-trigger { position: absolute; top: 0; left: 0; width: 100px; height: 100px; z-index: 100; cursor: pointer; }
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200;
            display: none; justify-content: center; align-items: center;
        }

        .pin-box { background: #1a1a24; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .pin-box input { font-size: 2rem; width: 150px; text-align: center; letter-spacing: 5px; background: #000; color: #fff; border: 2px solid #4facfe; border-radius: 8px; padding: 10px; margin: 20px 0; outline: none; }

        /* Admin Panel Modern Redesign */
        #admin-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(25px);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
            width: 95%; max-width: 600px; max-height: 90vh;
            display: none; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            z-index: 101; overflow: hidden;
        }

        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
        }
        .admin-header h2 { font-size: 1.3rem; color: #4facfe; letter-spacing: 1px; }
        .close-btn { background: none; border: none; color: #ff4757; font-size: 2rem; cursor: pointer; line-height: 1; }

        /* Sistem Tab Navigation */
        .admin-tabs {
            display: flex; overflow-x: auto; background: rgba(0,0,0,0.5);
            padding: 10px 10px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-tabs::-webkit-scrollbar { height: 4px; }
        .admin-tabs::-webkit-scrollbar-thumb { background: #4facfe; border-radius: 10px; }
        .tab-btn {
            background: none; border: none; color: #aaa; padding: 10px 15px;
            cursor: pointer; font-size: 0.9rem; font-weight: bold; white-space: nowrap;
            border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .tab-btn.active { color: #4facfe; border-bottom: 3px solid #4facfe; }

        .admin-content { padding: 20px; overflow-y: auto; flex: 1; }
        .admin-content::-webkit-scrollbar { width: 6px; }
        .admin-content::-webkit-scrollbar-track { background: transparent;}
        .admin-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .admin-section { display: none; animation: fadeIn 0.3s ease; }
        .admin-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #ddd; font-weight: 500;}
        .form-group-flex { display: flex; align-items: center; justify-content: space-between; gap:10px; margin-bottom: 10px;}
        
        select, input[type="range"], input[type="text"], input[type="number"], input[type="color"], input[type="file"], input[type="time"] {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; outline: none; transition: 0.3s;
        }
        select:focus, input[type="text"]:focus { border-color: #4facfe; }
        input[type="color"] { padding: 2px; height: 40px; cursor: pointer; }
        select option { background: #1a1a24; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #4facfe; }
        .checkbox-group label { margin: 0; cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.9rem;}
        .btn-primary { background: linear-gradient(45deg, #4facfe, #00f2fe); color: #000; }
        .btn-primary:hover { opacity: 0.8; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-warning { background: #ffd700; color: #000; }
        .btn-success { background: #2ed573; color: #000; }

        .slider-val { font-size: 0.8rem; color: #4facfe; float: right; font-weight: bold; background: rgba(79, 172, 254, 0.2); padding: 2px 8px; border-radius: 10px;}
    </style>
</head>
<body>

    <!-- 1. AREA PEMICU RAHASIA UNTUK ADMIN -->
    <div id="secret-trigger" title="Tap 5x cepat di sini untuk Admin Mode"></div>

    <!-- 2. PIN MODAL -->
    <div id="pin-modal" class="modal-overlay">
        <div class="pin-box">
            <h3 style="color: #4facfe; margin-bottom: 10px;">Security PIN Required</h3>
            <p style="font-size: 0.8rem; color: #aaa;">Default PIN: 1234</p>
            <input type="password" id="input-pin" maxlength="4" placeholder="••••">
            <div class="btn-group">
                <button class="btn btn-danger" id="btn-cancel-pin">Cancel</button>
                <button class="btn btn-primary" id="btn-submit-pin">Unlock</button>
            </div>
            <p id="pin-error" style="color: #ff4757; font-size: 0.8rem; margin-top: 10px; display: none;">PIN Salah!</p>
        </div>
    </div>

    <!-- 3. TOMBOL MATIKAN ALARM DI LAYAR (MUNCUL SAAT BUNYI) -->
    <button id="display-stop-alarm">MATIKAN ALARM</button>

    <!-- LAYER PENURUN KECERAHAN & ALARM FLASH -->
    <div id="brightness-overlay"></div>

    <!-- YOUTUBE PLAYER CONTAINER (HIDDEN) -->
    <div id="youtube-player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <!-- 4. TAMPILAN UTAMA (PROYEKTOR) -->
    <div id="display-container">
        <div id="theme-layer"></div>
        <div id="baby-name-layer" style="display:none;"></div>
        
        <!-- CUSTOM OVERLAY MEDIA/TEKS -->
        <div id="custom-overlay-layer">
            <img id="overlay-img-render" style="display:none;" src="" alt="Overlay Image">
            <div id="overlay-text-render" class="overlay-text" style="display:none;"></div>
        </div>

        <div id="quran-layer"></div>
        <div id="sleep-timer-display"></div>
        
        <div id="clock-layer">
            <div id="clock-render-area"></div>
            <div id="date-display" class="clock-date"></div>
        </div>

        <div id="prayer-layer">
            <div class="prayer-item"><div class="prayer-name">Subuh</div><div class="prayer-time" id="pray-Fajr">--:--</div></div>
            <div class="prayer-item"><div class="prayer-name">Dzuhur</div><div class="prayer-time" id="pray-Dhuhr">--:--</div></div>
            <div class="prayer-item"><div class="prayer-name">Ashar</div><div class="prayer-time" id="pray-Asr">--:--</div></div>
            <div class="prayer-item"><div class="prayer-name">Maghrib</div><div class="prayer-time" id="pray-Maghrib">--:--</div></div>
            <div class="prayer-item"><div class="prayer-name">Isya</div><div class="prayer-time" id="pray-Isha">--:--</div></div>
        </div>
    </div>

    <audio id="custom-audio-player" loop></audio>

    <!-- 5. PANEL ADMIN (DESAIN ELEGAN DENGAN TABS) -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2>✨ Baby Control Hub</h2>
            <button class="close-btn" id="btn-close-admin">×</button>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-target="sec-visual">🎨 Visuals</button>
            <button class="tab-btn" data-target="sec-text">✍️ Teks & Media</button>
            <button class="tab-btn" data-target="sec-audio">🎵 Audio & YT</button>
            <button class="tab-btn" data-target="sec-quran">📖 Quran</button>
            <button class="tab-btn" data-target="sec-time">🕰️ Time & Alarm</button>
            <button class="tab-btn" data-target="sec-sys">⚙️ System</button>
        </div>

        <div class="admin-content">
            
            <!-- SECTION 1: VISUALS -->
            <div id="sec-visual" class="admin-section active">
                <div class="form-group">
                    <label>Tema Latar (12 Pilihan)</label>
                    <select id="set-theme">
                        <option value="night-sky">🌌 Night Sky (Bintang Klasik)</option>
                        <option value="ocean">🌊 Ocean (Ombak Laut)</option>
                        <option value="forest">🌲 Forest (Hutan Kunang-kunang)</option>
                        <option value="sunset">🌅 Sunset (Senja Jingga)</option>
                        <option value="aurora">🎇 Aurora Borealis (Ungu Hijau)</option>
                        <option value="galaxy">🪐 Deep Galaxy</option>
                        <option value="rain">🌧️ Rain (Hujan Turun)</option>
                        <option value="snow">❄️ Snow (Salju Lembut)</option>
                        <option value="fire">🔥 Campfire (Percikan Api)</option>
                        <option value="underwater">🐡 Underwater (Gelembung Biru)</option>
                        <option value="clouds">☁️ Moving Clouds (Awan Berjalan)</option>
                        <option value="matrix">💻 The Matrix (Teks Hijau)</option>
                        <option value="custom">🛠️ Custom Editor (Warna Sendiri)</option>
                        <option value="blank">⬛ Blank (Hitam Polos)</option>
                    </select>
                </div>
                
                <div id="custom-theme-editor" style="display:none; padding-top: 10px;">
                    <div class="form-group-flex">
                        <div style="flex:1"><label>Gradient Atas</label><input type="color" id="set-bg1"></div>
                        <div style="flex:1"><label>Gradient Bawah</label><input type="color" id="set-bg2"></div>
                        <div style="flex:1"><label>Partikel</label><input type="color" id="set-pcolor"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Kecerahan (Redup) <span class="slider-val" id="val-brightness">0% Dark</span></label>
                    <input type="range" id="set-brightness" min="0" max="95" value="0">
                </div>
                <div class="form-group">
                    <label>Kepadatan Partikel <span class="slider-val" id="val-particle">60</span></label>
                    <input type="range" id="set-particle" min="0" max="200" value="60">
                </div>
                <div class="form-group">
                    <label>Kecepatan Animasi <span class="slider-val" id="val-speed">1x</span></label>
                    <input type="range" id="set-speed" min="0.1" max="3" step="0.1" value="1">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="set-performance">
                    <label for="set-performance">Mode Hemat Baterai / TV Low-end</label>
                </div>
            </div>

            <!-- SECTION 2: TEKS & MEDIA (NAMA, CUSTOM OVERLAY) -->
            <div id="sec-text" class="admin-section">
                <div class="form-group">
                    <label>Tampilkan Nama Bayi (Melayang)</label>
                    <input type="text" id="set-baby-name" placeholder="Ketik nama bayi...">
                    <div class="form-group-flex" style="margin-top:10px;">
                        <div style="flex:2">
                            <select id="set-baby-font">
                                <option value="'Segoe UI', sans-serif">Modern (Segoe UI)</option>
                                <option value="Arial, sans-serif">Basic (Arial)</option>
                                <option value="'Courier New', monospace">Monospace (Courier)</option>
                                <option value="'Comic Sans MS', cursive">Kids (Comic Sans)</option>
                                <option value="'Times New Roman', serif">Classic (Times NR)</option>
                                <option value="Impact, fantasy">Bold (Impact)</option>
                                <option value="'Trebuchet MS', sans-serif">Clean (Trebuchet)</option>
                                <option value="'Georgia', serif">Elegant (Georgia)</option>
                                <option value="'Palatino', serif">Royal (Palatino)</option>
                                <option value="'Brush Script MT', cursive">Handwriting (Brush)</option>
                                <option value="'Lucida Sans', sans-serif">Soft (Lucida)</option>
                            </select>
                        </div>
                        <div style="flex:1"><input type="color" id="set-baby-color" value="#ffffff"></div>
                    </div>
                </div>

                <div class="form-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <label>Custom Overlay Teks (Pojok Kanan)</label>
                    <input type="text" id="set-overlay-text" placeholder="Misal: Have a nice dream!">
                </div>
                <div class="form-group">
                    <label>Custom Overlay Media (Link URL Gambar/GIF)</label>
                    <input type="text" id="set-overlay-img" placeholder="https://domain.com/gambar.gif">
                </div>
            </div>

            <!-- SECTION 3: AUDIO & YOUTUBE -->
            <div id="sec-audio" class="admin-section">
                <div class="form-group">
                    <label>YouTube Player (ID Video)</label>
                    <div style="display:flex; gap:10px;">

        const QuranCtrl = {

            fetchAndRender: async () => {

                if (!state.showQuran) return;
                const layer = document.getElementById('quran-layer');
                layer.style.opacity = 1; layer.innerHTML = '<div style="font-size:1rem;">Memuat Ayat...</div>';
                try {
                    const res = await fetch(`https://api.alquran.cloud/v1/surah/${state.quranSurah}`);
                    const data = await res.json();
                    if(data.code === 200) {
                        QuranCtrl.ayahs = data.data.ayahs;
                        QuranCtrl.currentAyahIdx = 0;
                        QuranCtrl.currentSurahRendered = state.quranSurah;
                        QuranCtrl.playAyahLoop();
                    }
                } catch (e) { layer.innerHTML = '<div style="color:red;">Gagal memuat.</div>'; }
            },
            playAyahLoop: () => {
                if(!state.showQuran || QuranCtrl.ayahs.length === 0) return;
                const layer = document.getElementById('quran-layer');
                if(QuranCtrl.currentAyahIdx >= QuranCtrl.ayahs.length) QuranCtrl.currentAyahIdx = 0; // Loop kembali ke awal
                
                const ayahObj = QuranCtrl.ayahs[QuranCtrl.currentAyahIdx];
                const text = ayahObj.text;
                
                layer.style.opacity = 0; // Animasi fade out
                setTimeout(() => {
                    layer.innerHTML = `<div class="quran-ayah-text" style="font-family:${state.quranFont}; font-size:${state.quranSize}rem;">${text}</div><div class="quran-translation">Ayat ${ayahObj.numberInSurah}</div>`;
                    layer.style.opacity = 1; // Animasi fade in
                    
                    // Durasi cerdas berdasarkan panjang teks ayat * kecepatan pilihan user
                    const duration = (text.length * state.quranSpeed) + 2000; 
                    QuranCtrl.currentAyahIdx++;
                    QuranCtrl.timer = setTimeout(QuranCtrl.playAyahLoop, duration);
                }, 1000);
            },
            stop: () => { clearTimeout(QuranCtrl.timer); document.getElementById('quran-layer').innerHTML = ''; document.getElementById('quran-layer').style.opacity = 0; }

        const AlarmCtrl = {

                state.isAlarmRinging = true; StorageCtrl.save(true);
                
                document.getElementById('brightness-overlay').classList.add('alarm-flash');

                if(AlarmCtrl.ctx.state === 'suspended') AlarmCtrl.ctx.resume();

                AlarmCtrl.osc = AlarmCtrl.ctx.createOscillator(); const gain = AlarmCtrl.ctx.createGain();
                AlarmCtrl.osc.type = 'square'; AlarmCtrl.osc.frequency.setValueAtTime(800, AlarmCtrl.ctx.currentTime); 
                const lfo = AlarmCtrl.ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 4; lfo.connect(gain.gain); lfo.start();
                AlarmCtrl.osc.connect(gain); gain.connect(AlarmCtrl.ctx.destination); AlarmCtrl.osc.start();

        const ThemeCtrl = {

                const count = state.performanceMode ? Math.floor(state.particleCount / 2) : state.particleCount;

                const hr = now.getHours(); const min = now.getMinutes(); const sec = now.getSeconds();

                if (state.clockType === 'digital') {
                    const hStr = String(hr).padStart(2, '0'); const mStr = String(min).padStart(2, '0'); const sStr = String(sec).padStart(2, '0');
                    DOM.layerClockArea.innerHTML = `<div class="clock-digital" style="font-family: ${state.clockFont}; color: ${state.clockColor};">${hStr}:${mStr}:${sStr}</div>`;
                } else if (state.clockType === 'analog') {
                    const sD = (sec / 60) * 360; const mD = (min / 60) * 360 + (sec / 60) * 6; const hD = (hr / 12) * 360 + (min / 60) * 30;
                    DOM.layerClockArea.innerHTML = `<div class="clock-analog" style="border-color: ${state.clockColor};"><div class="hand hand-hour" style="transform: translateX(-50%) rotate(${hD}deg); background: ${state.clockColor};"></div><div class="hand hand-minute" style="transform: translateX(-50%) rotate(${mD}deg); background: ${state.clockColor};"></div><div class="hand hand-second" style="transform: translateX(-50%) rotate(${sD}deg)"></div><div class="analog-center"></div></div>`;
                } else { DOM.layerClockArea.innerHTML = ''; DOM.layerDate.innerText = ''; }

                // Pemicu Alarm
                if (state.alarmActive && state.alarmTime !== '') {
                    const hStrT = String(hr).padStart(2, '0'); const mStrT = String(min).padStart(2, '0');
                    if (state.alarmTime === `${hStrT}:${mStrT}` && sec === 0 && !AlarmCtrl.isRinging) AlarmCtrl.trigger();
                }

                if (state.autoNightMode) {
                    const isNight = (hr >= 18 || hr < 6);
                    if (isNight && !TimeCtrl.isNightModeTriggered) {
                        TimeCtrl.isNightModeTriggered = true; Object.assign(state, {theme: 'night-sky', brightness: 40, enWhiteNoise: true, masterVolume: 0.2});
                        AdminCtrl.syncUIToState(); ThemeCtrl.render(); AudioCtrl.play(); StorageCtrl.save(true);
                    } else if (!isNight && TimeCtrl.isNightModeTriggered) {
                        TimeCtrl.isNightModeTriggered = false; Object.assign(state, {brightness: 0, enWhiteNoise: false});
                        AdminCtrl.syncUIToState(); ThemeCtrl.render(); AudioCtrl.stop(); StorageCtrl.save(true);
                    }
                }

                if (TimeCtrl.timerEndTime) {
                    const diff = TimeCtrl.timerEndTime - now.getTime();
                    if (diff <= 0) {
                        TimeCtrl.timerEndTime = null; DOM.sleepTimerDisp.style.display = 'none'; state.brightness = 95; 
                        AdminCtrl.syncUIToState(); ThemeCtrl.render(); AudioCtrl.stop(); StorageCtrl.save(true);
                    } else {
                        const totalDur = DOM.uiSleepTimer.value * 60000; const progress = 1 - (diff / totalDur);
                        const m = Math.floor(diff / 60000); const s = Math.floor((diff % 60000) / 1000);
                        DOM.sleepTimerDisp.innerText = `Sleep in: ${m}m ${s}s`;
                        const targetBrightness = TimeCtrl.timerOriginalBrightness + ( (90 - TimeCtrl.timerOriginalBrightness) * progress );
                        DOM.layerOverlay.style.backgroundColor = `rgba(0,0,0,${targetBrightness / 100})`;
                    }
                }
            }
        };

        const AudioCtrl = {
            ctx: null, masterGain: null, nodes: {}, heartbeatInterval: null,
            initCtx: () => { if (!AudioCtrl.ctx) { AudioCtrl.ctx = new (window.AudioContext || window.webkitAudioContext)(); AudioCtrl.masterGain = AudioCtrl.ctx.createGain(); AudioCtrl.masterGain.connect(AudioCtrl.ctx.destination); } },
            createWhiteNoise: () => {
                const bufferSize = AudioCtrl.ctx.sampleRate * 2; const buffer = AudioCtrl.ctx.createBuffer(1, bufferSize, AudioCtrl.ctx.sampleRate);
                const output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noise = AudioCtrl.ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
                const filter = AudioCtrl.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600; noise.connect(filter);
                return { src: noise, out: filter };
            },
            createOcean: () => {
                const wn = AudioCtrl.createWhiteNoise(); wn.out.frequency.value = 300; 
                const lfo = AudioCtrl.ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08; 
                const lfoGain = AudioCtrl.ctx.createGain(); lfo.connect(lfoGain.gain); wn.out.connect(lfoGain); lfo.start();
                return { src: wn.src, out: lfoGain, extra: lfo };
            },
            startHeartbeat: (gainNode) => {
                AudioCtrl.heartbeatInterval = setInterval(() => {
                    if(AudioCtrl.ctx.state !== 'running') return;
                    const osc = AudioCtrl.ctx.createOscillator(); const env = AudioCtrl.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(40, AudioCtrl.ctx.currentTime); 
                    env.gain.setValueAtTime(0, AudioCtrl.ctx.currentTime); env.gain.linearRampToValueAtTime(1, AudioCtrl.ctx.currentTime + 0.1); env.gain.linearRampToValueAtTime(0, AudioCtrl.ctx.currentTime + 0.3); env.gain.linearRampToValueAtTime(1, AudioCtrl.ctx.currentTime + 0.4); env.gain.linearRampToValueAtTime(0, AudioCtrl.ctx.currentTime + 0.6); 
                    osc.connect(env); env.connect(gainNode); osc.start(AudioCtrl.ctx.currentTime); osc.stop(AudioCtrl.ctx.currentTime + 0.7);
                }, 1200); 
            },
            play: () => {
                AudioCtrl.stop(); 
                if (state.useCustomAudio && DOM.customAudioPlayer.src) { DOM.customAudioPlayer.volume = state.masterVolume; DOM.customAudioPlayer.play().catch(e=>console.log("Audio play blocked by browser")); }
                AudioCtrl.initCtx(); if(AudioCtrl.ctx.state === 'suspended') AudioCtrl.ctx.resume();
                AudioCtrl.masterGain.gain.value = state.masterVolume;
                if (state.enWhiteNoise) { const wn = AudioCtrl.createWhiteNoise(); const vol = AudioCtrl.ctx.createGain(); vol.gain.value = state.volWhiteNoise; wn.out.connect(vol).connect(AudioCtrl.masterGain); wn.src.start(); AudioCtrl.nodes['wn'] = wn.src; }
                if (state.enOcean) { const oc = AudioCtrl.createOcean(); const vol = AudioCtrl.ctx.createGain(); vol.gain.value = state.volOcean; oc.out.connect(vol).connect(AudioCtrl.masterGain); oc.src.start(); AudioCtrl.nodes['oc'] = oc.src; }
                if (state.enHeartbeat) { const vol = AudioCtrl.ctx.createGain(); vol.gain.value = state.volHeartbeat; vol.connect(AudioCtrl.masterGain); AudioCtrl.startHeartbeat(vol); }
            },
            stop: () => {
                DOM.customAudioPlayer.pause();
                Object.values(AudioCtrl.nodes).forEach(src => { try { src.stop(); src.disconnect(); } catch(e){} });
                AudioCtrl.nodes = {}; clearInterval(AudioCtrl.heartbeatInterval);
            },
            updateVolumes: () => {
                if(AudioCtrl.masterGain) AudioCtrl.masterGain.gain.setTargetAtTime(state.masterVolume, AudioCtrl.ctx.currentTime, 0.1);
                if(DOM.customAudioPlayer) DOM.customAudioPlayer.volume = state.masterVolume;
                if(ytPlayerReady && ytPlayer && typeof ytPlayer.setVolume === 'function') ytPlayer.setVolume(state.masterVolume * 100);
            }
        };

        const LocationCtrl = {
            fetchPrayer: async () => {
                if (!state.showPrayer) { DOM.layerPrayer.style.opacity = 0; return; }
                DOM.layerPrayer.style.opacity = 1;
                try {
                    const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${state.lat}&longitude=${state.lng}&method=11`);
                    const data = await res.json(); const t = data.data.timings;
                    document.getElementById('pray-Fajr').innerText = t.Fajr; document.getElementById('pray-Dhuhr').innerText = t.Dhuhr; document.getElementById('pray-Asr').innerText = t.Asr; document.getElementById('pray-Maghrib').innerText = t.Maghrib; document.getElementById('pray-Isha').innerText = t.Isha;
                } catch (e) { console.error("API Sholat error"); }
            },
            autoDetect: () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => { state.lat = pos.coords.latitude; state.lng = pos.coords.longitude; alert(`Lokasi Ditemukan! Lat: ${state.lat.toFixed(2)}, Lng: ${state.lng.toFixed(2)}`); LocationCtrl.fetchPrayer(); StorageCtrl.save(true); },
                        (err) => alert("Gagal akses lokasi. Gunakan koneksi HTTPS/Izinkan browser.")
                    );
                } else alert("Geolocation tidak didukung");
            }
        };

        const GestureCtrl = {
            touchStartX: 0, lastTap: 0,
            init: () => {
                window.addEventListener('touchstart', e => GestureCtrl.touchStartX = e.changedTouches[0].screenX);
                window.addEventListener('touchend', e => {
                    const endX = e.changedTouches[0].screenX; const diff = endX - GestureCtrl.touchStartX;
                    if (Math.abs(diff) > 100) {
                        const themes = ['night-sky', 'ocean', 'forest', 'sunset', 'aurora', 'galaxy', 'rain', 'snow', 'fire', 'underwater', 'clouds', 'matrix', 'blank']; let currIdx = themes.indexOf(state.theme);
                        if(diff > 0) currIdx = (currIdx - 1 + themes.length) % themes.length; else currIdx = (currIdx + 1) % themes.length; 
                        state.theme = themes[currIdx]; AdminCtrl.syncUIToState(); ThemeCtrl.render(); StorageCtrl.save(true);
                    }
                    const now = new Date().getTime();
                    if(now - GestureCtrl.lastTap < 300 && Math.abs(diff) < 20) {
                        if(Object.keys(AudioCtrl.nodes).length > 0 || !DOM.customAudioPlayer.paused) AudioCtrl.stop(); else AudioCtrl.play();
                    }
                    GestureCtrl.lastTap = now;
                });
                const goFullscreen = () => { if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } window.removeEventListener('click', goFullscreen); };
                window.addEventListener('click', goFullscreen);
            }
        };

        const AdminCtrl = {
            tapCount: 0, tapTimeout: null,
            init: () => {
                DOM.trigger.addEventListener('click', () => {
                    AdminCtrl.tapCount++; clearTimeout(AdminCtrl.tapTimeout);
                    if (AdminCtrl.tapCount >= 5) { DOM.pinModal.style.display = 'flex'; AdminCtrl.tapCount = 0; }
                    AdminCtrl.tapTimeout = setTimeout(() => AdminCtrl.tapCount = 0, 3000);
                });
                DOM.btnCancelPin.addEventListener('click', () => { DOM.pinModal.style.display = 'none'; DOM.inPin.value=''; DOM.pinError.style.display='none';});
                DOM.btnSubmitPin.addEventListener('click', () => {
                    if(DOM.inPin.value === state.adminPin) { DOM.pinModal.style.display = 'none'; DOM.adminPanel.style.display = 'flex'; DOM.inPin.value=''; DOM.pinError.style.display='none'; AdminCtrl.syncUIToState(); } 
                    else DOM.pinError.style.display = 'block';
                });
                DOM.btnCloseAdmin.addEventListener('click', () => DOM.adminPanel.style.display = 'none');

                // Sistem Tabs Elegan
                const tabBtns = document.querySelectorAll('.tab-btn');
                const sections = document.querySelectorAll('.admin-section');
                tabBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        tabBtns.forEach(b => b.classList.remove('active')); btn.classList.add('active');
                        sections.forEach(s => s.classList.remove('active'));
                        document.getElementById(btn.getAttribute('data-target')).classList.add('active');
                    });
                });

                // Teks & Media Overlay
                DOM.uiBabyName.addEventListener('input', e => { state.babyName = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiBabyFont.addEventListener('change', e => { state.babyFont = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiBabyColor.addEventListener('input', e => { state.babyColor = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiOverlayTxt.addEventListener('input', e => { state.overlayTxt = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiOverlayImg.addEventListener('input', e => { state.overlayImg = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });

                // Quran Setup
                DOM.uiQuranSize.addEventListener('change', e => { state.quranSize = e.target.value; StorageCtrl.save(true); });
                DOM.uiQuranFont.addEventListener('change', e => { state.quranFont = e.target.value; StorageCtrl.save(true); });
                DOM.uiQuranSpeed.addEventListener('input', e => { state.quranSpeed = e.target.value; document.getElementById('val-quran-speed').innerText = e.target.value+'ms'; StorageCtrl.save(true); });

                // Tombol Matikan Alarm di Layar
                DOM.btnDisplayStopAlarm.addEventListener('click', AlarmCtrl.stopGlobal);

                // Auto & Presets
                DOM.uiAutoNight.addEventListener('change', e => { state.autoNightMode = e.target.checked; StorageCtrl.save(true); });
                DOM.btnApplyPreset.addEventListener('click', () => { const p = DOM.uiPreset.value; if(Presets[p]) { Object.assign(state, Presets[p]); AdminCtrl.syncUIToState(); ThemeCtrl.render(); AudioCtrl.play(); StorageCtrl.save(true); } });
                DOM.uiSleepTimer.addEventListener('change', e => { state.sleepTimer = parseInt(e.target.value); TimeCtrl.startSleepTimer(state.sleepTimer); StorageCtrl.save(true); });
                DOM.uiAlarmTime.addEventListener('input', e => { state.alarmTime = e.target.value; StorageCtrl.save(true); });
                DOM.uiAlarmActive.addEventListener('change', e => { state.alarmActive = e.target.checked; StorageCtrl.save(true); });
                DOM.btnStopAlarm.addEventListener('click', AlarmCtrl.stopGlobal);
                DOM.uiTheme.addEventListener('change', e => { state.theme = e.target.value; DOM.uiCustomEditor.style.display = state.theme === 'custom' ? 'flex' : 'none'; ThemeCtrl.render(); StorageCtrl.save(true); });
                ['uiBg1','uiBg2','uiPColor'].forEach(id => DOM[id].addEventListener('input', e => { state[id.replace('ui','custom')] = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); }));
                DOM.uiBrightness.addEventListener('input', e => { state.brightness = e.target.value; document.getElementById('val-brightness').innerText = `${e.target.value}% Dark`; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiParticle.addEventListener('input', e => { state.particleCount = e.target.value; document.getElementById('val-particle').innerText = e.target.value; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiSpeed.addEventListener('input', e => { state.animSpeed = e.target.value; document.getElementById('val-speed').innerText = e.target.value+'x'; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.uiPerf.addEventListener('change', e => { state.performanceMode = e.target.checked; ThemeCtrl.render(); StorageCtrl.save(true); });
                DOM.btnLoadYt.addEventListener('click', () => { 
                    state.ytVideoId = DOM.uiYtId.value.trim(); 
                    if(ytPlayerReady && ytPlayer && typeof ytPlayer.loadVideoById === 'function') { ytPlayer.loadVideoById(state.ytVideoId); alert("YouTube Berhasil Dimuat! Silakan klik Play YT"); StorageCtrl.save(true); } 
                    else alert("API YouTube belum siap. Harap tunggu sebentar lalu coba lagi."); 
                });
                DOM.btnPlayYt.addEventListener('click', () => { state.ytPlayState = true; if(ytPlayerReady && ytPlayer) ytPlayer.playVideo(); StorageCtrl.save(true); });
                DOM.btnPauseYt.addEventListener('click', () => { state.ytPlayState = false; if(ytPlayerReady && ytPlayer) ytPlayer.pauseVideo(); StorageCtrl.save(true); });
                
                DOM.uiQuranSurah.addEventListener('input', e => { state.quranSurah = e.target.value; StorageCtrl.save(true); });
                DOM.uiShowQuran.addEventListener('change', e => { state.showQuran = e.target.checked; QuranCtrl.fetchAndRender(); StorageCtrl.save(true); });
                DOM.uiCustomAudioFile.addEventListener('change', e => { const file = e.target.files[0]; if(file) { DOM.customAudioPlayer.src = URL.createObjectURL(file); state.useCustomAudio = true; DOM.txtCustomAudioName.innerText = "Loaded: " + file.name; } });
                DOM.tglWN.addEventListener('change', e => { state.enWhiteNoise = e.target.checked; StorageCtrl.save(true); });
                DOM.tglOc.addEventListener('change', e => { state.enOcean = e.target.checked; StorageCtrl.save(true); });
                DOM.tglHb.addEventListener('change', e => { state.enHeartbeat = e.target.checked; StorageCtrl.save(true); });
                DOM.volWN.addEventListener('input', e => { state.volWhiteNoise = e.target.value/100; StorageCtrl.save(true); });
                DOM.volOc.addEventListener('input', e => { state.volOcean = e.target.value/100; StorageCtrl.save(true); });
                DOM.volHb.addEventListener('input', e => { state.volHeartbeat = e.target.value/100; StorageCtrl.save(true); });
                DOM.uiMasterVol.addEventListener('input', e => { state.masterVolume = e.target.value/100; document.getElementById('val-master-vol').innerText = e.target.value+'%'; AudioCtrl.updateVolumes(); StorageCtrl.save(true); });
                DOM.btnPlay.addEventListener('click', () => { AudioCtrl.play(); StorageCtrl.save(true); }); 
                DOM.btnStop.addEventListener('click', () => { AudioCtrl.stop(); StorageCtrl.save(true); });
                DOM.uiClock.addEventListener('change', e => { state.clockType = e.target.value; TimeCtrl.update(); StorageCtrl.save(true); });
                DOM.uiClockColor.addEventListener('input', e => { state.clockColor = e.target.value; TimeCtrl.update(); StorageCtrl.save(true); });
                DOM.uiClockFont.addEventListener('change', e => { state.clockFont = e.target.value; TimeCtrl.update(); StorageCtrl.save(true); });
                DOM.uiPrayer.addEventListener('change', e => { state.showPrayer = e.target.checked; LocationCtrl.fetchPrayer(); StorageCtrl.save(true); });
                DOM.btnGeo.addEventListener('click', LocationCtrl.autoDetect);
                DOM.btnChangePin.addEventListener('click', () => { const np = DOM.uiNewPin.value; if(np.length === 4) { state.adminPin = np; alert("PIN Updated!"); DOM.uiNewPin.value=''; StorageCtrl.save(true); } else alert("PIN harus 4 digit!"); });
                DOM.btnSaveState.addEventListener('click', () => StorageCtrl.save(false));
                DOM.btnResetState.addEventListener('click', StorageCtrl.reset);
            },
            syncUIToState: () => {
                DOM.uiAutoNight.checked = state.autoNightMode; DOM.uiTheme.value = state.theme; DOM.uiCustomEditor.style.display = state.theme === 'custom' ? 'flex' : 'none';
                DOM.uiBg1.value = state.customBg1; DOM.uiBg2.value = state.customBg2; DOM.uiPColor.value = state.customPColor;
                DOM.uiBrightness.value = state.brightness; document.getElementById('val-brightness').innerText = `${state.brightness}% Dark`;
                DOM.uiParticle.value = state.particleCount; document.getElementById('val-particle').innerText = state.particleCount;
                DOM.uiSpeed.value = state.animSpeed; document.getElementById('val-speed').innerText = state.animSpeed+'x';
                DOM.uiPerf.checked = state.performanceMode; DOM.uiAlarmTime.value = state.alarmTime; DOM.uiAlarmActive.checked = state.alarmActive;
                DOM.uiYtId.value = state.ytVideoId; DOM.uiQuranSurah.value = state.quranSurah; DOM.uiShowQuran.checked = state.showQuran;
                DOM.uiQuranSize.value = state.quranSize; DOM.uiQuranFont.value = state.quranFont; DOM.uiQuranSpeed.value = state.quranSpeed; document.getElementById('val-quran-speed').innerText = state.quranSpeed+'ms';
                DOM.tglWN.checked = state.enWhiteNoise; DOM.volWN.value = state.volWhiteNoise * 100;
                DOM.tglOc.checked = state.enOcean; DOM.volOc.value = state.volOcean * 100;
                DOM.tglHb.checked = state.enHeartbeat; DOM.volHb.value = state.volHeartbeat * 100;
                DOM.uiMasterVol.value = state.masterVolume * 100; document.getElementById('val-master-vol').innerText = (state.masterVolume*100)+'%';
                DOM.uiBabyName.value = state.babyName; DOM.uiBabyFont.value = state.babyFont; DOM.uiBabyColor.value = state.babyColor;
                DOM.uiOverlayTxt.value = state.overlayText || ''; DOM.uiOverlayImg.value = state.overlayImg || '';
                DOM.uiClock.value = state.clockType; DOM.uiClockColor.value = state.clockColor; DOM.uiClockFont.value = state.clockFont; DOM.uiPrayer.checked = state.showPrayer;
            }
        };

        function startApp() {
            StorageCtrl.load(); AdminCtrl.init(); AdminCtrl.syncUIToState(); ThemeCtrl.render(); TimeCtrl.init();        
            LocationCtrl.fetchPrayer(); GestureCtrl.init(); QuranCtrl.fetchAndRender();
            loadYouTubeScript(); setInterval(LocationCtrl.fetchPrayer, 1000 * 60 * 60 * 12);
            StorageCtrl.listenFirebase(); 
        }
        window.onload = startApp;
    </script>
</body>
</html>
